name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  stack:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - run: docker compose run --rm cli python3 -m database.migrate
      - run: docker compose run --rm cli python3 -m homepedia.healthcheck
      - run: docker compose run --rm cli /opt/spark/bin/spark-submit --master spark://spark-master:7077 processing/spark/jobs/smoke_job.py
      - run: docker compose run --rm cli python3 -m ingestion.pipelines.run geo_reference sncf_stations education grand_debat
      - run: docker compose run --rm cli python3 -m pytest -q -m integration -o addopts=""
      - if: always()
        run: docker compose logs --no-color > compose.log; docker compose down -v
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: compose-logs, path: compose.log }
