x-app: &app
  build:
    context: .
    dockerfile: infrastructure/docker/app.Dockerfile
  image: homepedia/app:local
  env_file: .env
  environment: &app-env
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    MONGO_HOST: mongo
    MONGO_PORT: 27017
    SPARK_MASTER_URL: spark://spark-master:7077
    DATA_LAKE_ROOT: /opt/homepedia/data
  volumes:
    - ./:/opt/homepedia

services:
  postgres:
    image: postgis/postgis:16-3.4
    env_file: .env
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports: ["${MONGO_PORT:-27017}:27017"]
    volumes:
      - mongo_data:/data/db
      - ./database/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  spark-master:
    <<: *app
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master
    ports: ["${SPARK_MASTER_PORT:-7077}:7077", "${SPARK_UI_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  spark-worker:
    <<: *app
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --work-dir /tmp/spark-work spark://spark-master:7077
    environment:
      <<: *app-env
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    ports: ["${SPARK_WORKER_UI_PORT:-8081}:8081"]
    depends_on:
      spark-master: { condition: service_healthy }

  jupyter:
    <<: *app
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --NotebookApp.token='' --notebook-dir=/opt/homepedia
    ports: ["${JUPYTER_PORT:-8888}:8888"]
    depends_on:
      spark-master: { condition: service_healthy }

  streamlit:
    <<: *app
    command: streamlit run apps/streamlit/Home.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    ports: ["${STREAMLIT_PORT:-8501}:8501"]
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }

  # one-shot CLI container: `docker compose run --rm cli <command>`
  cli:
    <<: *app
    profiles: ["tools"]
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      spark-master: { condition: service_healthy }

volumes:
  postgres_data:
  mongo_data:
