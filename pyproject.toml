[project]
name = "homepedia"
version = "0.1.0"
description = "DataOps + Big Data + Geospatial + AI platform for the French housing market"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.1",
    "pymongo>=4.7",
    "pyspark==3.5.5",
    "pyarrow>=16",
    "shapely>=2.0",
    "streamlit>=1.36",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = ["S101", "RUF012"]  # asserts in tests; class-level dict config on connectors is intentional

[tool.mypy]
python_version = "3.11"
strict = true
files = ["homepedia", "processing", "database", "apps", "tests", "ingestion", "analytics"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires running docker services"]
addopts = "-m 'not integration'"
